<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADIBUS - Seat Selection & Booking</title>
    <link rel="icon" href="https://media-hosting.imagekit.io/3a38ffeb7f3d489e/ChatGPT%20Image%20Apr%2018,%202025,%2003_11_14%20PM.png" type="image/png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="Seatmap.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .passenger-form {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; color: #444; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        .form-control:focus { border-color: #d32f2f; outline: none; }
        .home-btn { display: inline-block; margin-bottom: 15px; text-decoration: none; color: #555; font-weight: 600; font-size: 14px; }
    </style>
</head>

<body>

<div class="container">

    <a href="index.html" class="home-btn"><i class="fas fa-arrow-left"></i> Back to Search</a>

    <h1>🚌 ADIBUS Seat Selection</h1>

    <div class="bus-info">
        <div>
            <strong id="routeTitle">Kolkata → Delhi</strong>
            <span id="busNameText">ADIBUS Royal Multi-Axle Express</span>
        </div>
        <div>
            <strong id="busPriceText">₹1,250 / seat</strong>
            <span id="travelDateText">Departure: 8:00 PM</span>
        </div>
    </div>

    <div class="legend">
        <div><span class="legend-seat available"></span> Available</div>
        <div><span class="legend-seat selected"></span> Selected</div>
        <div><span class="legend-seat booked"></span> Booked</div>
    </div>

    <div class="bus">

        <div class="driver">
            <div class="steering">◉</div>
            <span>Driver</span>
        </div>

        <div class="seats" id="seatContainer">
            <!-- Seats generated by JavaScript -->
        </div>

    </div>

    <div class="passenger-form">
        <h3 style="margin-top: 0; margin-bottom: 15px; color: #333; font-size: 16px;"><i class="fas fa-user-circle" style="color: #d32f2f;"></i> Passenger Information</h3>
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="passengerName" class="form-control" placeholder="Enter primary passenger name" />
        </div>
        <div class="form-group">
            <label>Email Address (For e-Ticket delivery)</label>
            <input type="email" id="passengerEmail" class="form-control" placeholder="name@example.com" />
        </div>
        <div class="form-group">
            <label>Mobile Number</label>
            <input type="tel" id="passengerPhone" class="form-control" placeholder="10-digit phone number" maxlength="10" />
        </div>
    </div>

    <div class="booking-panel">
        <div>
            <span>Selected Seats</span>
            <strong id="selectedSeats">None</strong>
        </div>

        <div>
            <span>Total Amount</span>
            <strong id="total">₹0</strong>
        </div>

        <button id="bookButton">Confirm & Book Ticket</button>
    </div>

</div>

<script src="api-config.js"></script>
<script src="auth.js"></script>
<script src="Seatmap.js"></script>

</body>
</html>
