<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Seat Booking</title>
    <link rel="stylesheet" href="Seatmap.css">
</head>

<body>

<div class="container">

    <h1>🚌 Bus Seat Booking</h1>

    <div class="bus-info">
        <div>
            <strong>Mumbai → Pune</strong>
            <span>AC Sleeper Bus</span>
        </div>
        <div>
            <strong>₹500 / seat</strong>
            <span>Today • 8:30 PM</span>
        </div>
    </div>

    <div class="legend">
        <div><span class="legend-seat available"></span> Available</div>
        <div><span class="legend-seat selected"></span> Selected</div>
        <div><span class="legend-seat booked"></span> Booked</div>
    </div>

    <div class="bus">

        <div class="driver">
            <div class="steering">◉</div>
            <span>Driver</span>
        </div>

        <div class="seats" id="seatContainer">
            <!-- Seats generated by JavaScript -->
        </div>

    </div>

    <div class="booking-panel">
        <div>
            <span>Selected Seats</span>
            <strong id="selectedSeats">None</strong>
        </div>

        <div>
            <span>Total</span>
            <strong id="total">₹0</strong>
        </div>

        <button id="bookButton">Continue Booking</button>
    </div>

</div>

<script src="Seatmap.js"></script>

</body>
</html>
